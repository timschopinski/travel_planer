<div class="card border-secondary m-2">
    <div class="card-body">
        <h4 class="card-title">Parent to child</h4>

        <div class="form-control">
            <input [(ngModel)]="msg" type="text">
        </div>

        <button (click)="btnSendClick()" type="button" class="btn btn-primary m-2">
            Send Message to Child
        </button>

        <app-child inforFromParent={{messageToChild}}></app-child>

    </div>
</div>

<hr>
<div class="card border-secondary m-2">
    <div class="card-body">
        <h4 class="card-title">Child to parent</h4>
        <h3>{{messageFromChild}}</h3>

        <app-child-output (childMessage)="getMessage($event)"></app-child-output>

    </div>
</div>

<hr>
<div class="card border-secondary m-2">
    <div class="card-body">
        <h4 class="card-title">Parallel components</h4>

        <div class="row justify-content-center align-items-center g-2">
            <div class="col-6">
                <app-component1></app-component1>
            </div>
            <div class="col-6">
                <app-component2></app-component2>
            </div>
        </div>


    </div>
</div>
